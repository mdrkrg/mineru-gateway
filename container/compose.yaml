# Upstream mineru-router / mineru-api are external services (not managed here);
# set GATEWAY_UPSTREAM_URL to their address.
services:
  db:
    image: docker.io/library/postgres:18-alpine
    restart: always
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: gateway
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    image: mineru-gateway
    build:
      context: ..
      dockerfile: container/Containerfile
    restart: unless-stopped
    environment:
      GATEWAY_UPSTREAM_URL: ${GATEWAY_UPSTREAM_URL:?set upstream router/api URL}
      GATEWAY_DATABASE_URL: postgresql+asyncpg://gateway:${POSTGRES_PASSWORD:?set in .env}@db:5432/gateway
      GATEWAY_ADMIN_TOKEN: ${GATEWAY_ADMIN_TOKEN:?set in .env}
      GATEWAY_ALLOW_ANONYMOUS: "false"
      GATEWAY_GATEWAY_URL: ${GATEWAY_GATEWAY_URL:-http://localhost:8000}
      GATEWAY_FILE_CACHE_DIR: /cache
      GATEWAY_MAX_UPLOAD_SIZE: "524288000"          # 500MB
      GATEWAY_RATE_LIMIT_PER_KEY: "10"              # per key, per second
      GATEWAY_MAX_CONCURRENT_TASKS: "0"             # 0 disables the global cap
      GATEWAY_TASK_RETENTION_DAYS: "90"
      GATEWAY_JSON_LOGS: "true"
    volumes:
      - gateway_cache:/cache
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: container/Containerfile.frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_LISTEN:-127.0.0.1:3000}:80"
    depends_on:
      - gateway

volumes:
  db_data:
  gateway_cache:
