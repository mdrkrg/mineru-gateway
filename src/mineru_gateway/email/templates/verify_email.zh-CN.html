<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>验证您的邮箱地址</title>
</head>

<body
  style="margin:0;padding:0;background-color:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,Arial,sans-serif;line-height:1.6;color:#1f2937;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
    style="background-color:#f4f5f7;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
          style="max-width:560px;background-color:#ffffff;border-radius:8px;padding:32px;">
          <tr>
            <td style="padding-bottom:12px;font-size:18px;font-weight:700;">
              验证您的邮箱地址
            </td>
          </tr>
          <tr>
            <td style="padding-bottom:24px;font-size:14px;">
              您好，
            </td>
          </tr>
          <tr>
            <td style="padding-bottom:24px;font-size:14px;">
              请点击下方按钮完成邮箱验证。
            </td>
          </tr>
          <tr>
            <td align="center" style="padding-bottom:24px;">
              <a href="{{ verify_url }}"
                style="display:inline-block;background-color:#2563eb;color:#ffffff;text-decoration:none;font-size:14px;font-weight:600;padding:12px 32px;border-radius:6px;">
                验证邮箱
              </a>
            </td>
          </tr>
          <tr>
            <td style="padding-bottom:24px;font-size:12px;color:#6b7280;word-break:break-all;">
              如果按钮无法点击，请在浏览器中打开以下链接：<br>
              <a href="{{ verify_url }}" style="color:#2563eb;text-decoration:underline;">{{ verify_url }}</a>
            </td>
          </tr>
          <tr>
            <td style="padding-bottom:24px;font-size:12px;color:#6b7280;">
              {%- if lifetime_hours >= 1 %}
              该链接将在 {{ lifetime_hours }} 小时后失效。
              {%- else %}
              该链接将在 {{ lifetime_minutes }} 分钟后失效。
              {%- endif %}
            </td>
          </tr>
          <tr>
            <td style="font-size:12px;color:#6b7280;">
              如果您没有注册账户，请忽略本邮件。
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>

</html>
